<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkPhone</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<header>
    <div class="logo">🍎 DarkPhone</div>

    <nav>
        <a href="#">Головна</a>
        <a href="#">Каталог</a>
        <a href="#">Новинки</a>
        <a href="#">Акції</a>
        <a href="#">Контакти</a>
    </nav>

    <button class="login">Увійти</button>
</header>

<section class="hero">
    <div class="left">
        <h1>iPhone 16 Pro</h1>
        <p>Нове покоління швидкості та дизайну.</p>
        <button>Замовити</button>
    </div>

    <div class="right">
        <img src="images/iphone16pro.png" alt="iPhone">
    </div>
</section>

<h2 class="title">Популярні моделі</h2>

<section class="cards">

    <div class="card">
        <img src="images/iphone16pro.png">
        <h3>iPhone 16 Pro</h3>
        <p>256 GB</p>
        <h4>54 999 грн</h4>
        <button>Купити</button>
    </div>

    <div class="card">
        <img src="images/iphone16.png">
        <h3>iPhone 16</h3>
        <p>128 GB</p>
        <h4>42 999 грн</h4>
        <button>Купити</button>
    </div>

    <div class="card">
        <img src="images/iphone15.png">
        <h3>iPhone 15</h3>
        <p>128 GB</p>
        <h4>35 999 грн</h4>
        <button>Купити</button>
    </div>

</section>

<footer>
    <p>© 2026 DarkPhone</p>
</footer>

</body>
</html>
